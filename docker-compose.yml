version: '3.8'

services:
  app:
    container_name: portfolio-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "9501:9501"
      - "9500:9500"
    volumes:
      - ./:/opt/www
      - ./storage:/opt/www/storage
      - ./runtime:/opt/www/runtime
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
      - DB_DRIVER=sqlite
      - DB_DATABASE=/opt/www/runtime/database.sqlite
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - ADMIN_ID=${ADMIN_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9501/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    container_name: portfolio-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  redis-data:
    driver: local

networks:
  portfolio-network:
    driver: bridge
